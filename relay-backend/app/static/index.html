<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Mobile-first: base rules below target phones. Desktop is an
     enhancement layered on top via a min-width media query at the
     bottom. On mobile, one view (Chat / Memory) is visible at a
     time behind a tab bar, like a native app, not stacked panels.
     ============================================================ */

  :root {
    --bg: #FBFBFA;
    --surface: #FFFFFF;
    --border: #EAEAEA;
    --ink: #17181C;
    --ink-soft: #787774;
    --accent: #17181C;
    --accent-soft: #F1F0EC;
    --mem-bg: #EDF3EC;
    --mem-text: #346538;
    --mem-border: #D3E4D1;
    --serif: 'Newsreader', Georgia, serif;
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'SF Mono', 'Consolas', monospace;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--ink);
    background: var(--bg);
    /* 100vh on mobile counts the space behind the address bar, so the page
       renders taller than what's actually visible and the composer sits
       below the fold until you scroll. 100dvh tracks the real visible
       viewport instead; the 100vh line stays first as a fallback for
       browsers that don't support dvh yet. */
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* mobile tab bar, switches between Chat and Memory */
  #tabbar { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  #tabbar button {
    flex: 1; padding: 0.85rem; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.02em;
    border: none; background: none; color: var(--ink-soft); cursor: pointer;
    border-bottom: 2px solid transparent; font-family: var(--sans);
  }
  #tabbar button.active { color: var(--ink); border-bottom-color: var(--ink); }

  /* one view visible at a time on mobile, controlled by body[data-view] */
  #main, #memory-panel { display: none; flex: 1; min-height: 0; }
  body[data-view="chat"] #main { display: flex; }
  body[data-view="memory"] #memory-panel { display: flex; }

  /* first-visit onboarding, shown once (see relay_onboarded in localStorage) —
     centered on every screen size, not a bottom sheet on mobile */
  #onboarding {
    position: fixed; inset: 0; background: rgba(23,24,28,0.4); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 1rem;
  }
  #onboarding[hidden] { display: none; }
  #onboarding .card {
    background: var(--surface); border-radius: 14px; width: 100%; max-width: 420px;
    padding: 1.4rem 1.3rem 1.6rem; box-shadow: 0 8px 30px rgba(0,0,0,0.14);
  }
  #onboarding .step-glyph { font-family: var(--serif); font-size: 1rem; color: var(--ink-soft); margin-bottom: 0.3rem; }
  #onboarding h3 { font-family: var(--serif); font-weight: 500; font-size: 1.25rem; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
  #onboarding p { font-size: 0.88rem; color: var(--ink-soft); line-height: 1.55; margin: 0 0 1.3rem; }
  #onboarding .actions { display: flex; align-items: center; justify-content: space-between; }
  #onboarding .dots { display: flex; gap: 0.3rem; }
  #onboarding .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
  #onboarding .dots span.active { background: var(--ink); }
  #onboarding button.next {
    font-size: 0.82rem; font-weight: 600; padding: 0.55rem 1.1rem; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; cursor: pointer; font-family: var(--sans);
  }
  #onboarding button.skip {
    font-size: 0.78rem; color: var(--ink-soft); background: none; border: none; cursor: pointer;
    font-family: var(--sans); padding: 0.5rem;
  }

  #main { flex-direction: column; min-width: 0; min-height: 0; }
  #header { padding: 1rem 1.1rem 0.9rem; border-bottom: 1px solid var(--border); background: var(--surface); }
  #header .title { font-family: var(--serif); font-size: 1.4rem; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 0.2rem; }
  #header .sub { font-weight: 400; color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; margin-bottom: 0.7rem; }

  .folder-bar { display: flex; gap: 0.35rem; overflow-x: auto; padding-bottom: 0.15rem; }
  .folder-bar::-webkit-scrollbar { display: none; }
  .folder-bar button {
    flex-shrink: 0; font-family: var(--sans); font-size: 0.72rem; font-weight: 500;
    padding: 0.32rem 0.65rem; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink-soft); cursor: pointer; white-space: nowrap;
  }
  .folder-bar button.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .folder-bar button.add { color: var(--ink); border-style: dashed; }

  #chat { flex: 1; overflow-y: auto; padding: 1.1rem; display: flex; flex-direction: column; gap: 0.7rem; min-height: 0; background: var(--surface); }
  .bubble { max-width: 86%; padding: 0.65rem 0.9rem; border-radius: 10px; font-size: 0.92rem; line-height: 1.55; }
  .bubble.user { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 3px; }
  .bubble.assistant { align-self: flex-start; background: var(--accent-soft); color: var(--ink); border-bottom-left-radius: 3px; }
  .bubble.thinking { color: var(--ink-soft); font-style: italic; animation: thinking-pulse 1.4s ease-in-out infinite; }
  @keyframes thinking-pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

  #empty-state { margin: auto; text-align: center; max-width: 320px; padding: 0 1rem; }
  #empty-state .glyph { font-family: var(--serif); font-size: 2.2rem; color: var(--ink); margin-bottom: 0.6rem; }
  #empty-state .hint { color: var(--ink-soft); font-size: 0.85rem; line-height: 1.6; }

  #composer { border-top: 1px solid var(--border); background: var(--surface); padding: 0.75rem 1.1rem 1rem; flex-shrink: 0; }
  #input-row { display: flex; gap: 0.5rem; }
  #message {
    flex: 1; font-size: 0.95rem; padding: 0.65rem 0.85rem; border-radius: 8px; border: 1px solid var(--border);
    font-family: var(--sans); background: var(--bg); color: var(--ink);
  }
  #message:focus { outline: none; border-color: #C7C6C1; background: var(--surface); }
  #send {
    font-size: 0.85rem; font-weight: 600; padding: 0.65rem 1.15rem; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; cursor: pointer; font-family: var(--sans);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  #send:hover { background: #333; }
  #send:active { transform: scale(0.97); }
  #send:disabled { background: #CFCFCC; cursor: default; transform: none; }
  #status { font-size: 0.72rem; color: var(--ink-soft); margin-top: 0.5rem; min-height: 1em; }
  #status:empty { margin-top: 0; min-height: 0; } /* no reserved gap when there's nothing to show — status is blank most of the time now that saving is explicit-only */
  #status.saving { color: #7A6A2E; }
  #status.saved { color: var(--mem-text); }

  /* memory panel */
  #memory-panel { flex-direction: column; background: var(--surface); padding: 1.1rem; overflow-y: auto; }
  #memory-panel h2 { font-family: var(--serif); font-weight: 500; font-size: 1.1rem; margin: 0 0 0.2rem; letter-spacing: -0.01em; }
  #memory-panel .sub { font-size: 0.75rem; color: var(--ink-soft); margin-bottom: 1.1rem; line-height: 1.5; }

  .category-group { margin-bottom: 1.1rem; }
  .category-group .category-header {
    display: flex; align-items: baseline; gap: 0.4rem; margin-bottom: 0.5rem;
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-soft); font-family: var(--sans);
  }
  .category-group .category-header .count { font-weight: 400; letter-spacing: 0; text-transform: none; color: #ABAAA5; }

  .fact-card { border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem 0.8rem; font-size: 0.83rem; margin-bottom: 0.55rem; background: var(--bg); }
  .fact-card .content { color: var(--ink); line-height: 1.5; }
  .fact-card .tag-row { margin-top: 0.4rem; }
  .fact-card .link-tag {
    background: var(--mem-bg); color: var(--mem-text); border: 1px solid var(--mem-border);
    border-radius: 5px; padding: 0.08rem 0.35rem; font-size: 0.63rem; letter-spacing: 0.03em;
  }
  #memory-empty { color: var(--ink-soft); font-size: 0.85rem; padding: 1rem 0; text-align: center; }

  /* Only the current value shows in the card by default — history isn't
     spelled out inline, just counted: a "+N" badge for how many earlier
     values this one replaced. The whole card is the click target to
     expand/collapse, not just the badge. */
  .content-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
  .fact-card.expandable { cursor: pointer; }
  .fact-card.expandable:hover { border-color: #C7C6C1; }
  .history-badge {
    flex-shrink: 0; font-size: 0.78rem; font-weight: 800; color: var(--ink);
  }
  .history-badge.expanded { font-weight: 400; }
  .history-list { margin-top: 0.4rem; padding-top: 0.35rem; border-top: 1px dashed var(--border); }
  .history-item { color: var(--ink-soft); font-size: 0.78rem; line-height: 1.6; }

  /* ============================================================
     Desktop enhancement: chat + memory side by side, tab bar gone.
     Layered ON TOP of the mobile base above, not the default.
     ============================================================ */
  @media (min-width: 760px) {
    body { flex-direction: row; height: 100vh; height: 100dvh; }
    #tabbar { display: none; }
    #main, #memory-panel { display: flex; }

    #memory-panel {
      order: -1; /* visually first (left), regardless of DOM order */
      flex: 0 0 22%;
      min-width: 260px;
      border-left: none;
      border-right: 1px solid var(--border);
    }
    #main { flex: 1 1 78%; }

    .bubble { max-width: 62%; }
    #chat { padding: 1.5rem; }
    #header { padding: 1.1rem 1.5rem; }
    #composer { padding: 0.85rem 1.5rem 1.1rem; }
  }
</style>
</head>
<body data-view="chat">

<div id="onboarding" hidden>
  <div class="card">
    <div class="step-glyph">Relay</div>
    <h3 id="onboarding-title"></h3>
    <p id="onboarding-body"></p>
    <div class="actions">
      <div class="dots" id="onboarding-dots"></div>
      <div>
        <button class="skip" id="onboarding-skip">Skip</button>
        <button class="next" id="onboarding-next">Next</button>
      </div>
    </div>
  </div>
</div>

<div id="tabbar">
  <button data-view="chat" class="active">Chat</button>
  <button data-view="memory">Memory</button>
</div>

<div id="main">
  <div id="header">
    <div class="title">Relay</div>
    <div class="sub">Chat normally. Folder: <span id="folder-label">general</span> — switch it from the Memory tab.</div>
  </div>
  <div id="chat">
    <div id="empty-state">
      <div class="glyph">Relay</div>
      <div class="hint">Chat normally. Say "save this" or "remember that" when you want something kept.</div>
    </div>
  </div>
  <div id="composer">
    <div id="input-row">
      <input id="message" placeholder="Say something...">
      <button id="send">Send</button>
    </div>
    <div id="status"></div>
  </div>
</div>

<div id="memory-panel">
  <h2>Memory</h2>
  <div class="sub">What the assistant chose to save, oldest to newest.</div>
  <div class="folder-bar" id="folder-bar-memory" style="margin-bottom: 1rem;"></div>
  <div id="memory-list">(loading&hellip;)</div>
</div>

<script>
// Identity is a random id this browser generates once and stores in
// localStorage, sent with every request — not the visitor's IP. IP-based
// identity was tried and reverted: a visitor's IP address isn't guaranteed
// stable request-to-request (mobile data, some Wi-Fi, corporate NAT), which
// silently changes who the server thinks you are on ANY request, not just
// across a refresh — a real reported bug (facts vanishing on a plain folder
// switch) that a stored client id doesn't have, since it isn't tied to the
// network at all. Folder is a namespace under that id, picked here and sent
// with every request; the server does the id + folder -> session_id
// scoping (see scoped_session in app/main.py).
function getClientId() {
  try {
    let id = localStorage.getItem('relay_client_id');
    if (!id) {
      id = 'visitor-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      localStorage.setItem('relay_client_id', id);
    }
    return id;
  } catch (e) {
    // storage blocked (private mode, extensions) — still works for this
    // page load, just won't be remembered on the next one
    return 'visitor-' + Math.random().toString(36).slice(2, 10);
  }
}
const CLIENT_ID = getClientId();

let currentFolder = 'general';

function getStoredFolder() {
  try { return localStorage.getItem('relay_folder') || 'general'; }
  catch (e) { return 'general'; }
}
function storeFolder(name) {
  try { localStorage.setItem('relay_folder', name); } catch (e) {}
}

// /my-folders only knows about folders that have at least one saved fact —
// it finds them by querying the facts table, so a brand-new folder with
// nothing saved in it yet is invisible to the server. Without this, a
// visitor who creates a folder, then navigates away before anything gets
// saved to it, loses the folder entirely from the switcher — indistinguishable
// from it having been deleted, even though nothing on the server ever held it.
// This keeps every folder name the visitor has ever switched to on this
// device, so the pill always stays clickable and they can get back to it,
// whether or not it has facts in it yet.
function getKnownFolders() {
  try { return JSON.parse(localStorage.getItem('relay_known_folders') || '["general"]'); }
  catch (e) { return ['general']; }
}
function rememberFolder(name) {
  try {
    const known = getKnownFolders();
    if (!known.includes(name)) {
      known.push(name);
      localStorage.setItem('relay_known_folders', JSON.stringify(known));
    }
  } catch (e) {}
}

async function loadFolders() {
  const res = await fetch(`/my-folders?client_id=${encodeURIComponent(CLIENT_ID)}`);
  const folders = await res.json();
  const names = new Set(folders.map(f => f.folder));
  for (const name of getKnownFolders()) names.add(name);
  names.add(currentFolder); // always show the active one, even brand new
  renderFolderBar('folder-bar-memory', Array.from(names));
  const label = document.getElementById('folder-label');
  if (label) label.textContent = currentFolder;
}

function renderFolderBar(containerId, names) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = names.map(name =>
    `<button class="${name === currentFolder ? 'active' : ''}" data-folder="${name}">${name}</button>`
  ).join('') + `<button class="add" data-add>+ Folder</button>`;

  el.querySelectorAll('button[data-folder]').forEach(btn => {
    btn.addEventListener('click', () => switchFolder(btn.dataset.folder));
  });
  const addBtn = el.querySelector('[data-add]');
  if (addBtn) addBtn.addEventListener('click', createFolder);
}

function switchFolder(name) {
  if (name === currentFolder) return;
  currentFolder = name;
  storeFolder(name);
  rememberFolder(name);
  document.getElementById('chat').innerHTML = `<div id="empty-state">
    <div class="glyph">Relay</div>
    <div class="hint">Say something worth remembering, or just say hello. Relay decides what stays.</div>
  </div>`; // switching folders starts a fresh chat view — the memory itself is untouched, just which folder's conversation is on screen
  loadFolders();
  loadMemory();
}

function createFolder() {
  const name = (prompt('Name this folder (e.g. "pomodoro-app"):') || '').trim();
  if (!name) return;
  switchFolder(name);
}

// First-visit onboarding, shown once — explains the two things people keep
// getting confused by without it: how to make sure something gets saved
// (nothing is saved unless you ask), and that saved facts live in a folder
// they can switch or create, separate from the chat itself.
const ONBOARDING_STEPS = [
  {
    title: 'Chat like normal.',
    body: "Talk to Relay the way you'd talk to any AI. There's no form to fill out, it's a real conversation.",
  },
  {
    title: 'Tell it what to save.',
    body: 'Nothing gets saved on its own. Say "save this" or "remember that" and it is, every time, guaranteed.',
  },
  {
    title: 'Everything lands in a folder.',
    body: `You're in "${currentFolder}" right now. Saved facts live there, grouped and linked, nothing ever gets overwritten. Use "+ Folder" any time you want a separate folder for a different project.`,
  },
];
let onboardingStep = 0;

function renderOnboardingStep() {
  const step = ONBOARDING_STEPS[onboardingStep];
  document.getElementById('onboarding-title').textContent = step.title;
  document.getElementById('onboarding-body').textContent = step.body;
  document.getElementById('onboarding-dots').innerHTML = ONBOARDING_STEPS.map((_, i) =>
    `<span class="${i === onboardingStep ? 'active' : ''}"></span>`
  ).join('');
  document.getElementById('onboarding-next').textContent =
    onboardingStep === ONBOARDING_STEPS.length - 1 ? 'Got it' : 'Next';
}

function dismissOnboarding() {
  document.getElementById('onboarding').hidden = true;
  try { localStorage.setItem('relay_onboarded', '1'); } catch (e) {}
}

function maybeShowOnboarding() {
  let seen = false;
  try { seen = localStorage.getItem('relay_onboarded') === '1'; } catch (e) {}
  if (seen) return;
  onboardingStep = 0;
  renderOnboardingStep();
  document.getElementById('onboarding').hidden = false;
}

document.getElementById('onboarding-next').addEventListener('click', () => {
  if (onboardingStep < ONBOARDING_STEPS.length - 1) {
    onboardingStep += 1;
    renderOnboardingStep();
  } else {
    dismissOnboarding();
  }
});
document.getElementById('onboarding-skip').addEventListener('click', dismissOnboarding);

function showView(name) {
  document.body.dataset.view = name;
  document.querySelectorAll('#tabbar button').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.view === name);
  });
}

document.querySelectorAll('#tabbar button').forEach((btn) => {
  btn.addEventListener('click', () => showView(btn.dataset.view));
});

function bubble(kind, text) {
  const chat = document.getElementById('chat');
  const empty = document.getElementById('empty-state');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'bubble ' + kind;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// Grouped by category (like Torqon's own dashboard) rather than one flat
// list — makes it visible at a glance which facts are "type" vs "feature"
// vs "decision", and which specific fact an update actually re-linked to.
// A fact that updates an earlier one was rendering as just another flat
// card in the pile, with a small text tag as the only clue it was
// connected to anything — reported directly as feeling disconnected, which
// undersells the one thing this whole app is actually for. Facts within a
// category are now reassembled into their real chains (following
// parent_fact_id) and each chain renders as ONE card: a small vertical
// timeline, superseded entries dimmed and struck through, the current
// value bold at the bottom — an update visibly replaces what came before
// it instead of just sitting near it.
function buildChains(items) {
  const byId = new Map(items.map(f => [f.id, f]));
  const childOf = new Map(); // parent_fact_id -> the fact that supersedes it
  const roots = [];
  for (const f of items) {
    if (f.parent_fact_id && byId.has(f.parent_fact_id)) {
      childOf.set(f.parent_fact_id, f);
    } else {
      roots.push(f);
    }
  }
  return roots.map(root => {
    const chain = [root];
    let cur = root;
    while (childOf.has(cur.id)) {
      cur = childOf.get(cur.id);
      chain.push(cur);
    }
    return chain;
  });
}

// Which chains are currently expanded, keyed by the latest fact's id —
// module-level so it survives a re-render (loadMemory runs again after
// every save, which would otherwise collapse everything back each time).
const expandedChains = new Set();

function renderMemory(facts) {
  const el = document.getElementById('memory-list');
  if (!facts.length) {
    el.innerHTML = '<div id="memory-empty">Nothing saved yet.</div>';
    return;
  }

  const groups = new Map(); // preserves first-seen order of each category
  for (const f of facts) {
    const cat = f.category || 'general';
    if (!groups.has(cat)) groups.set(cat, []);
    groups.get(cat).push(f);
  }

  el.innerHTML = Array.from(groups.entries()).map(([category, items]) => {
    const chains = buildChains(items);
    const cards = chains.map(chain => {
      const latest = chain[chain.length - 1];
      const historyCount = chain.length - 1;
      const isExpanded = historyCount > 0 && expandedChains.has(latest.id);

      // Always the same "+N" glyphs — swapping to a "−" for the expanded
      // state read as noticeably thinner than "+" even at the identical
      // font-weight (checked: both computed to 800), so the state now
      // shows via a filled background instead of changing the character.
      const badge = historyCount > 0
        ? `<span class="history-badge${isExpanded ? ' expanded' : ''}">+${historyCount}</span>`
        : '';
      // The "updated" pill is gone — the bold badge above already says
      // that. "new" still shows for a fact with no history at all, nothing
      // else marks it as fresh otherwise.
      const tagRow = historyCount === 0 ? `<div class="tag-row"><span class="link-tag">new</span></div>` : '';
      // No strikethrough — an earlier value isn't crossed out, just shown
      // plainly as what it used to be.
      const history = isExpanded
        ? `<div class="history-list">${chain.slice(0, -1).map(f =>
            `<div class="history-item">${f.content}</div>`
          ).join('')}</div>`
        : '';
      const cardClass = historyCount > 0 ? 'fact-card expandable' : 'fact-card';
      const chainAttr = historyCount > 0 ? ` data-chain-id="${latest.id}"` : '';

      return `<div class="${cardClass}"${chainAttr}>
        <div class="content-row">
          <div class="content">${latest.content}</div>
          ${badge}
        </div>
        ${history}
        ${tagRow}
      </div>`;
    }).join('');
    return `<div class="category-group">
      <div class="category-header">${category} <span class="count">${chains.length}</span></div>
      ${cards}
    </div>`;
  }).join('');

  // The whole card is the click target now, not just the badge — clicking
  // anywhere on it toggles the history, the badge is just a visual hint.
  el.querySelectorAll('.fact-card.expandable').forEach(card => {
    card.addEventListener('click', () => {
      const id = Number(card.dataset.chainId);
      if (expandedChains.has(id)) expandedChains.delete(id);
      else expandedChains.add(id);
      renderMemory(facts); // re-render with the same data, just toggled
    });
  });
}

async function loadMemory() {
  // Guard against an out-of-order response: if the visitor switches folders
  // quickly, an earlier fetch for the previous folder can resolve AFTER the
  // new one and overwrite fresh data with stale data — the exact bug behind
  // "a new folder shows the previous folder's memory". Capture which folder
  // this request was actually for, and drop the result if currentFolder has
  // since moved on.
  const requestedFolder = currentFolder;
  const res = await fetch(`/my-memory/${encodeURIComponent(requestedFolder)}?client_id=${encodeURIComponent(CLIENT_ID)}`);
  const facts = await res.json();
  if (requestedFolder !== currentFolder) return;
  renderMemory(facts);
}

// A real request here can take a few seconds (an LLM call, sometimes a
// retry on top of that), and there's no other status text shown anymore
// now that saving is explicit-only — without this it just goes quiet after
// you hit send, which reads as broken rather than working. Cycles through
// a few phrases so it visibly keeps moving instead of sitting on one
// static word.
const THINKING_PHRASES = ['Thinking', 'Brewing', 'Piecing it together', 'Fetching from memory'];
let thinkingTimer = null;

function showThinking() {
  const chat = document.getElementById('chat');
  const empty = document.getElementById('empty-state');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'bubble assistant thinking';
  div.id = 'thinking-bubble';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  let i = 0;
  const tick = () => { div.textContent = THINKING_PHRASES[i % THINKING_PHRASES.length] + '…'; i += 1; };
  tick();
  thinkingTimer = setInterval(tick, 900);
}

function hideThinking() {
  clearInterval(thinkingTimer);
  document.getElementById('thinking-bubble')?.remove();
}

async function send() {
  const input = document.getElementById('message');
  const message = input.value.trim();
  if (!message) return;
  const status = document.getElementById('status');

  bubble('user', message);
  input.value = '';
  status.className = '';
  status.textContent = ''; // no "deciding..." message — nothing is saved unless explicitly asked, so there's nothing to announce mid-flight
  document.getElementById('send').disabled = true;
  showThinking();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, folder: currentFolder, client_id: CLIENT_ID })
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    hideThinking();
    bubble('assistant', data.reply);
    if (data.saved_facts && data.saved_facts.length) {
      // Same bubble style as the assistant's own reply, not a separate
      // colored notification — reads as part of the conversation, not a
      // system toast. The Memory tab is where the actual detail lives,
      // this is just confirmation it happened.
      const n = data.saved_facts.length;
      bubble('assistant', n === 1 ? 'I saved this to Relay.' : `I saved these to Relay.`);
      await loadMemory();
      loadFolders(); // fact counts may have changed
      status.className = 'saved';
      status.textContent = n === 1 ? 'saved 1 fact to Relay memory' : `saved ${n} facts to Relay memory`;
    }
    // no explicit save ask -> saved_facts is always empty, that's the
    // expected default now, not worth a status line every single message
  } catch (e) {
    hideThinking();
    status.className = '';
    status.textContent = 'error: ' + e.message;
  } finally {
    document.getElementById('send').disabled = false;
  }
}

document.getElementById('send').addEventListener('click', send);
document.getElementById('message').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') send();
});

// Voice input (mic button, live captions, waveform) was built and then
// pulled back out — it kept surfacing new edge cases (a race that could
// leave a live mic stream open with nothing to stop it, an <svg> element
// quirk where .hidden silently didn't hide) and wasn't worth the added
// risk this close to the deadline. Only add it back if there's real spare
// time to actually test it properly on a real device.

(async function init() {
  // ?folder=name overrides the remembered one, for jumping straight to a
  // specific folder without clicking through the switcher.
  const params = new URLSearchParams(location.search);
  const requested = params.get('folder');
  currentFolder = requested || getStoredFolder();
  storeFolder(currentFolder);
  rememberFolder(currentFolder);
  await loadFolders();
  await loadMemory();
  maybeShowOnboarding();
})();
</script>
